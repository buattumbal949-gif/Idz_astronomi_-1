<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Idz si Astronomi</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hid{display:none!important}
#labels{position:fixed;inset:0;pointer-events:none}
.lab{position:absolute;left:0;top:0;font-size:13px;letter-spacing:.02em;color:#fff;text-shadow:0 1px 4px #000;white-space:nowrap;will-change:transform}
#brand{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));pointer-events:none}
#brand b{display:block;font-size:18px;font-weight:600}
#brand span{font-size:12px;opacity:.6}
#bar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#bar .sp{flex:1}
button{font:inherit;color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);border-radius:22px;min-height:44px;min-width:44px;padding:0 14px;cursor:pointer}
button:active{background:rgba(255,255,255,.22)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.side{position:fixed;top:40%;font-size:24px;padding:0}
#prev{left:8px}#next{right:8px}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:44%;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px calc(16px + env(safe-area-inset-bottom));background:rgba(6,6,8,.88);border-radius:18px 18px 0 0;border-top:1px solid rgba(255,255,255,.18)}
#panel h2{margin:0;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ac)}
.cl{margin:2px 0 10px;font-size:13px;color:var(--ac)}
#panel p{margin:0 0 10px;font-size:14.5px;line-height:1.55;color:#e8e8ea}
dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
dt{color:#9a9aa2}dd{margin:0}
ul.f{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5;color:#d4d4d8}
@media (orientation:landscape) and (min-width:600px){
 #panel{left:auto;top:0;width:min(360px,40%);max-height:none;border-radius:0;border-top:0;border-left:1px solid rgba(255,255,255,.18);padding-top:calc(64px + env(safe-area-inset-top))}
 #bar{right:calc(min(360px,40%) + 10px)}
 #next{right:calc(min(360px,40%) + 10px)}
 body.closed #next,body.closed #bar{right:10px}
}
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:5;transition:opacity .5s}
#loading small{opacity:.6}
#note{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 12px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:4;max-width:90%;text-align:center}
#note.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="brand"><b>Idz si Astronomi</b><span>Geser kiri-kanan, ketuk objek</span></div>
<div id="bar" class="hid">
 <button id="back">‹ Tata surya</button><div class="sp"></div>
 <button id="info">Info</button><button id="reset">Reset</button><button id="zin" aria-label="Perbesar">+</button><button id="zout" aria-label="Perkecil">−</button>
</div>
<button id="prev" class="side hid" aria-label="Objek sebelumnya">‹</button>
<button id="next" class="side hid" aria-label="Objek berikutnya">›</button>
<section id="panel" class="hid"></section>
<div id="loading"><div id="lt">Menyiapkan tata surya…</div><small id="ls"></small></div>
<div id="note"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
function fatal(m){$('lt').textContent=m;$('ls').textContent='Periksa koneksi internet, lalu muat ulang halaman.';}
if(!window.THREE){fatal('Three.js gagal dimuat.');return;}
var T=THREE;

/* ===== DATA OBJEK (visual: r = radius skala visual, x = posisi horizontal) ===== */
var DATA=[
{id:'sun',nama:'Matahari',kelas:'Bintang di pusat tata surya',x:0,r:1.3,tilt:0,spin:.12,col:'#ffb23e',
 desc:'Matahari adalah bintang yang terdiri terutama dari hidrogen dan helium. Energinya dihasilkan melalui fusi nuklir di inti, dan cahayanya menjadi sumber energi utama bagi Bumi.',
 st:[['Diameter','sekitar 1,39 juta km'],['Suhu fotosfer (permukaan)','sekitar 5.500 °C'],['Suhu inti','sekitar 15 juta °C'],['Jarak dari Bumi','sekitar 150 juta km']],
 fk:['Suhu inti jauh lebih tinggi daripada suhu permukaannya.','Matahari menyumbang sekitar 99,8% massa seluruh tata surya.']},
{id:'mercury',nama:'Merkurius',kelas:'Planet berbatu, terdekat dari Matahari',x:3.2,r:.35,tilt:0,spin:.05,col:'#b5b0a8',
 desc:'Merkurius adalah planet terkecil di tata surya dan hanya sedikit lebih besar dari Bulan Bumi. Permukaannya penuh kawah, dan atmosfernya sangat tipis sehingga hampir tidak menahan panas.',
 st:[['Diameter','sekitar 4.879 km'],['Suhu','sekitar 430 °C (siang), −180 °C (malam)'],['Jarak dari Matahari','sekitar 58 juta km']],
 fk:['Satu tahun Merkurius hanya sekitar 88 hari Bumi.','Karena nyaris tak berudara, suhu siang dan malamnya sangat jauh berbeda.']},
{id:'venus',nama:'Venus',kelas:'Planet berbatu, atmosfer tebal',x:5,r:.6,tilt:3,spin:-.03,col:'#e3bb76',
 desc:'Venus hampir sebesar Bumi, tetapi diselimuti atmosfer karbon dioksida yang sangat tebal. Atmosfer itu memerangkap panas melalui efek rumah kaca yang ekstrem, sehingga Venus menjadi planet terpanas.',
 st:[['Diameter','sekitar 12.104 km'],['Suhu permukaan','sekitar 465 °C'],['Jarak dari Matahari','sekitar 108 juta km']],
 fk:['Venus berputar searah terbalik dibanding kebanyakan planet.','Satu hari Venus (rotasi, ±243 hari Bumi) lebih lama daripada satu tahunnya (±225 hari).']},
{id:'earth',nama:'Bumi',kelas:'Planet berbatu, rumah kita',x:7.1,r:.65,tilt:23.4,spin:.25,col:'#4f9dff',
 desc:'Bumi adalah satu-satunya tempat yang sejauh ini diketahui memiliki kehidupan. Sekitar 71% permukaannya tertutup air, dan atmosfernya melindungi kita sekaligus menjaga suhu tetap bersahabat.',
 st:[['Diameter','sekitar 12.742 km (rata-rata)'],['Suhu rata-rata','sekitar 15 °C'],['Jarak dari Matahari','sekitar 150 juta km']],
 fk:['Kemiringan sumbu Bumi sekitar 23,4° menyebabkan pergantian musim.','Bumi memiliki satu satelit alami, yaitu Bulan.']},
{id:'mars',nama:'Mars',kelas:'Planet berbatu, si planet merah',x:9.2,r:.45,tilt:25,spin:.24,col:'#d9693f',
 desc:'Mars berwarna merah karena permukaannya kaya besi oksida (karat). Atmosfernya tipis dan dingin, tetapi ada tanda-tanda bahwa dahulu air pernah mengalir di permukaannya.',
 st:[['Diameter','sekitar 6.779 km'],['Suhu rata-rata','sekitar −60 °C'],['Jarak dari Matahari','sekitar 228 juta km']],
 fk:['Olympus Mons, gunung berapi di Mars, tingginya sekitar 22 km dan tertinggi di tata surya.','Mars punya dua bulan kecil: Phobos dan Deimos.']},
{id:'jupiter',nama:'Jupiter',kelas:'Planet raksasa gas',x:12,r:1.1,tilt:3,spin:.5,col:'#d8b08a',
 desc:'Jupiter adalah planet terbesar di tata surya, terdiri terutama dari hidrogen dan helium. Pita-pita awannya terbentuk oleh angin kencang, dan planet ini tidak memiliki permukaan padat.',
 st:[['Diameter','sekitar 143 ribu km (ekuator)'],['Suhu','sekitar −110 °C (tingkat 1 bar)'],['Jarak dari Matahari','sekitar 778 juta km']],
 fk:['Bintik Merah Besar adalah badai raksasa yang lebih lebar dari Bumi.','Jupiter memiliki lebih dari 90 bulan yang telah diketahui.']},
{id:'saturn',nama:'Saturnus',kelas:'Planet raksasa gas, bercincin',x:16.2,r:.9,tilt:26.7,spin:.45,col:'#e6cf9a',ring:true,
 desc:'Saturnus terkenal dengan sistem cincinnya yang luas, yang sebagian besar tersusun dari bongkahan es air. Seperti Jupiter, planet ini didominasi hidrogen dan helium.',
 st:[['Diameter','sekitar 120 ribu km (ekuator)'],['Suhu','sekitar −140 °C (tingkat 1 bar)'],['Jarak dari Matahari','sekitar 1,43 miliar km']],
 fk:['Kerapatan rata-rata Saturnus lebih kecil daripada air.','Cincinnya lebar ratusan ribu kilometer, tetapi sangat tipis.']},
{id:'uranus',nama:'Uranus',kelas:'Planet raksasa es',x:19.8,r:.75,tilt:98,spin:-.3,col:'#9fe0e6',
 desc:'Uranus tampak biru kehijauan karena metana di atmosfernya menyerap cahaya merah. Planet ini tergolong raksasa es karena banyak mengandung air, amonia, dan metana di bagian dalamnya.',
 st:[['Diameter','sekitar 50.724 km'],['Suhu','sekitar −195 °C (tingkat 1 bar)'],['Jarak dari Matahari','sekitar 2,87 miliar km']],
 fk:['Sumbunya miring sekitar 98°, sehingga Uranus berputar seperti menggelinding.','Uranus juga memiliki cincin, tetapi tipis dan gelap.']},
{id:'neptune',nama:'Neptunus',kelas:'Planet raksasa es, terjauh',x:22.6,r:.75,tilt:28,spin:.32,col:'#4a73e8',
 desc:'Neptunus adalah planet terjauh dari Matahari. Warnanya biru pekat, dan atmosfernya menjadi tempat angin tercepat yang tercatat di antara semua planet.',
 st:[['Diameter','sekitar 49.244 km'],['Suhu','sekitar −200 °C (tingkat 1 bar)'],['Jarak dari Matahari','sekitar 4,5 miliar km']],
 fk:['Angin di Neptunus dapat melebihi 2.000 km/jam.','Satu tahun Neptunus setara sekitar 165 tahun Bumi.']}
];
/* Tekstur online opsional. Jika gagal dimuat, tekstur buatan (procedural) tetap dipakai. */
var BASE='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/';
var REMOTE={earth:BASE+'earth_atmos_2048.jpg'};
var CLOUDS=BASE+'earth_clouds_1024.png';

/* ===== TEKSTUR PROCEDURAL ===== */
function hash(x,y){var h=Math.imul(x,374761393)+Math.imul(y,668265263);h=Math.imul(h^(h>>13),1274126177);return((h^(h>>16))>>>0)/4294967295;}
function vn(x,y,px){var x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
 var xa=((x0%px)+px)%px,xb=(((x0+1)%px)+px)%px,a=hash(xa,y0),b=hash(xb,y0),c=hash(xa,y0+1),d=hash(xb,y0+1);
 return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;}
function fb(u,v,f,o){var s=0,a=.5;for(var i=0;i<o;i++){var px=f<<i;s+=a*vn(u*px,v*px/2,px);a/=2;}return(s-.47)*2.2+.5;}
function ramp(t,s){t=t<0?0:t>1?1:t;var p=t*(s.length-1),i=Math.min(s.length-2,Math.floor(p)),f=p-i,a=s[i],b=s[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
var GEN={
 sun:function(u,v){return ramp(fb(u,v,6,5),[[170,40,0],[240,110,10],[255,190,50],[255,240,150]]);},
 mercury:function(u,v){return ramp(fb(u,v,8,5),[[70,68,66],[140,136,130],[195,190,182]]);},
 venus:function(u,v){var n=fb(u,v,4,4),b=.5+.5*Math.sin(v*16+n*6);return ramp(b*.55+n*.45,[[170,120,60],[215,170,100],[242,215,155]]);},
 earth:function(u,v){var n=fb(u,v,4,5),lat=Math.abs(v-.5)*2;if(lat>.88+n*.05)return[240,245,250];
  if(n>.55)return ramp((n-.55)*2.5+lat*.3,[[50,120,50],[110,130,60],[150,120,80]]);return ramp(n*1.2,[[8,35,95],[20,80,165]]);},
 mars:function(u,v){var n=fb(u,v,8,5),r=ramp(n,[[110,50,30],[180,90,50],[218,145,95]]);return fb(u+.3,v,3,3)>.68?[r[0]*.6,r[1]*.6,r[2]*.6]:r;},
 jupiter:function(u,v){var n=fb(u,v,6,3),b=.5+.5*Math.sin(v*Math.PI*13+n*3.5),r=ramp(b*.8+n*.2,[[150,100,70],[210,175,130],[238,218,184]]);
  var dx=(u-.3)/.07,dy=(v-.63)/.045,e=dx*dx+dy*dy;if(e<1){var k=1-e;r=[r[0]+(190-r[0])*k,r[1]+(80-r[1])*k,r[2]+(50-r[2])*k];}return r;},
 saturn:function(u,v){var n=fb(u,v,5,3),b=.5+.5*Math.sin(v*Math.PI*11+n*2);return ramp(b*.7+n*.3,[[185,155,105],[225,200,150],[240,226,186]]);},
 uranus:function(u,v){var n=fb(u,v,3,3);return ramp(.5+.5*Math.sin(v*9)*.4+n*.2,[[145,205,212],[172,224,230],[190,236,240]]);},
 neptune:function(u,v){var n=fb(u,v,5,4),b=.5+.5*Math.sin(v*Math.PI*8+n*2.5);return ramp(b*.6+n*.4,[[28,55,155],[58,98,208],[110,150,236]]);}
};
function makeTex(k){var W=512,H=256,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),im=x.createImageData(W,H),d=im.data,g=GEN[k];
 for(var j=0;j<H;j++)for(var i=0;i<W;i++){var o=(j*W+i)*4,q=g(i/W,j/H);d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2];d[o+3]=255;}
 x.putImageData(im,0,0);var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=2;return t;}
function ringTex(){var c=document.createElement('canvas');c.width=512;c.height=4;var x=c.getContext('2d');
 for(var i=0;i<512;i++){var t=i/511,a=0;
  if(t<.12)a=.05;else if(t<.3)a=.22+.1*Math.sin(t*90);else if(t<.62)a=.85-.2*Math.abs(Math.sin(t*60));else if(t<.67)a=.04;else if(t<.95)a=.6+.15*Math.sin(t*70);
  x.fillStyle='rgba('+(205+30*t|0)+','+(185+25*t|0)+','+(150+20*t|0)+','+a+')';x.fillRect(i,0,1,4);}
 var tx=new T.CanvasTexture(c);tx.encoding=T.sRGBEncoding;return tx;}
function glowTex(){var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d'),g=x.createRadialGradient(64,64,10,64,64,64);
 g.addColorStop(0,'rgba(255,200,90,.85)');g.addColorStop(.35,'rgba(255,140,30,.3)');g.addColorStop(1,'rgba(255,100,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c);}
function atmo(r,col){return new T.Mesh(new T.SphereGeometry(r*1.07,48,32),new T.ShaderMaterial({uniforms:{c:{value:new T.Color(col)}},
 vertexShader:'varying vec3 n;varying vec3 v;void main(){n=normalize(normalMatrix*normal);vec4 m=modelViewMatrix*vec4(position,1.);v=-m.xyz;gl_Position=projectionMatrix*m;}',
 fragmentShader:'uniform vec3 c;varying vec3 n;varying vec3 v;void main(){float f=pow(1.-abs(dot(normalize(n),normalize(v))),3.);gl_FragColor=vec4(c,f*.85);}',
 transparent:true,blending:T.AdditiveBlending,depthWrite:false}));}

/* ===== RENDERER & SCENE ===== */
var cv=$('c'),renderer;
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});}catch(e){fatal('Perangkat atau browser ini tidak mendukung WebGL.');return;}
renderer.outputEncoding=T.sRGBEncoding;renderer.setClearColor(0x000000,1);
var scene=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.05,300),TAN=Math.tan(22.5*Math.PI/180);
scene.add(new T.AmbientLight(0xffffff,.2));
var sunLight=new T.PointLight(0xffffff,1.7,0,0);sunLight.position.set(0,0,0);scene.add(sunLight);

(function stars(){var n=1400,p=new Float32Array(n*3);for(var i=0;i<n;i++){p[i*3]=-30+Math.random()*90;p[i*3+1]=-35+Math.random()*70;p[i*3+2]=-45-Math.random()*60;}
 var g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));
 scene.add(new T.Points(g,new T.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,transparent:true,opacity:.75})));})();

var objs=[],proxies=[],labelsEl=$('labels'),loader=new T.TextureLoader();loader.setCrossOrigin('anonymous');
function note(m){var n=$('note');n.textContent=m;n.classList.add('on');clearTimeout(note.t);note.t=setTimeout(function(){n.classList.remove('on');},4500);}

function build(d){
 var root=new T.Group();root.position.set(d.x,0,0);
 var tiltG=new T.Group();root.add(tiltG);
 var base=new T.Quaternion().setFromEuler(new T.Euler(d.ring?.45:.3,0,d.tilt*Math.PI/180));tiltG.quaternion.copy(base);
 var mat=d.id==='sun'?new T.MeshBasicMaterial({map:makeTex('sun')}):new T.MeshLambertMaterial({map:makeTex(d.id)});
 var mesh=new T.Mesh(new T.SphereGeometry(d.r,64,40),mat);tiltG.add(mesh);
 var o={d:d,root:root,tilt:tiltG,mesh:mesh,base:base,mat:mat,clouds:null,fr:d.r*(d.ring?2.4:1)};
 if(d.id==='sun'){var s=new T.Sprite(new T.SpriteMaterial({map:glowTex(),blending:T.AdditiveBlending,depthWrite:false,transparent:true}));s.scale.set(d.r*4.4,d.r*4.4,1);root.add(s);}
 if(d.id==='earth')tiltG.add(atmo(d.r,0x4a90ff));
 if(d.id==='venus')tiltG.add(atmo(d.r,0xffcc88));
 if(d.id==='mars')tiltG.add(atmo(d.r,0xff9966));
 if(d.id==='uranus')tiltG.add(atmo(d.r,0x88ddee));
 if(d.id==='neptune')tiltG.add(atmo(d.r,0x5577ff));
 if(d.ring){var inn=d.r*1.3,out=d.r*2.3,g=new T.RingGeometry(inn,out,96),p=g.attributes.position,uv=g.attributes.uv,v=new T.Vector3();
  for(var i=0;i<p.count;i++){v.fromBufferAttribute(p,i);uv.setXY(i,(v.length()-inn)/(out-inn),.5);}
  var ring=new T.Mesh(g,new T.MeshLambertMaterial({map:ringTex(),transparent:true,side:T.DoubleSide,depthWrite:false}));ring.rotation.x=-Math.PI/2;tiltG.add(ring);}
 var px=new T.Mesh(new T.SphereGeometry(1,10,8),new T.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,colorWrite:false}));
 var pr=Math.max(d.r*1.25,.75);px.scale.set(pr,pr,pr);px.position.copy(root.position);px.userData.i=objs.length;scene.add(px);proxies.push(px);
 scene.add(root);
 var lb=document.createElement('div');lb.className='lab';lb.textContent=d.nama;labelsEl.appendChild(lb);o.lab=lb;
 objs.push(o);
 if(REMOTE[d.id])loader.load(REMOTE[d.id],function(t){t.encoding=T.sRGBEncoding;mat.map=t;mat.needsUpdate=true;},undefined,function(){note('Tekstur online '+d.nama+' gagal dimuat. Memakai tekstur buatan.');});
 if(d.id==='earth')loader.load(CLOUDS,function(t){t.encoding=T.sRGBEncoding;var c=new T.Mesh(new T.SphereGeometry(d.r*1.012,64,40),new T.MeshLambertMaterial({map:t,transparent:true,depthWrite:false}));tiltG.add(c);o.clouds=c;},undefined,function(){});
}
var bi=0;
function step(){
 if(bi>=DATA.length){$('loading').style.opacity=0;setTimeout(function(){$('loading').classList.add('hid');},550);resize();start();return;}
 $('ls').textContent='Tekstur '+(bi+1)+' dari '+DATA.length+': '+DATA[bi].nama;
 try{build(DATA[bi]);}catch(e){console.error(e);note('Gagal membuat '+DATA[bi].nama+'.');}
 bi++;setTimeout(step,16);
}

/* ===== KAMERA & INTERAKSI ===== */
var mode='over',idx=0,panX=0,tx=0,ty=0,tz=20,ovZ=20,visW=25,zMin=1,zMax=10,d0=5,pw=0,ph=0,land=false,panelOpen=true;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function panLimits(){var h=visW/2,a=h-1.8,b=24.4-h;return a>b?[11.3,11.3]:[a,b];}
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 visW=cam.aspect<1?10:25;ovZ=visW/(2*TAN*cam.aspect);
 if(mode==='over'){var l=panLimits();panX=clamp(panX,l[0],l[1]);tz=ovZ;}else{setFocusLimits(false);measure();}}
function setFocusLimits(reset){var o=objs[idx];if(!o)return;var fr=o.fr;d0=Math.max(fr*3.6,fr*1.35/(TAN*cam.aspect));zMin=Math.max(o.d.r*1.5,.4);zMax=d0*2.6;if(reset)tz=d0;tz=clamp(tz,zMin,zMax);}
function measure(){var p=$('panel');if(!panelOpen||p.classList.contains('hid')){pw=ph=0;return;}land=p.offsetWidth<window.innerWidth*.9;pw=land?p.offsetWidth:0;ph=land?0:p.offsetHeight;}
function focus(i){
 var n=DATA.length;idx=(i+n)%n;mode='focus';var o=objs[idx];if(!o)return;var d=o.d;
 labelsEl.classList.add('hid');$('brand').classList.add('hid');
 ['bar','prev','next','panel'].forEach(function(k){$(k).classList.remove('hid');});
 var p=$('panel');p.style.setProperty('--ac',d.col);
 p.innerHTML='<h2><i class="dot"></i>'+d.nama+'</h2><p class="cl">'+d.kelas+'</p><p>'+d.desc+'</p><dl>'+d.st.map(function(s){return'<dt>'+s[0]+'</dt><dd>'+s[1]+'</dd>';}).join('')+'</dl><ul class="f">'+d.fk.map(function(f){return'<li>'+f+'</li>';}).join('')+'</ul>';
 p.scrollTop=0;p.classList.toggle('hid',!panelOpen);document.body.classList.toggle('closed',!panelOpen);
 o.tilt.quaternion.copy(o.base);setFocusLimits(true);measure();
}
function home(){mode='over';idx=Math.max(idx,0);labelsEl.classList.remove('hid');$('brand').classList.remove('hid');
 ['bar','prev','next','panel'].forEach(function(k){$(k).classList.add('hid');});document.body.classList.remove('closed');
 var o=objs[idx],l=panLimits();if(o)panX=clamp(o.d.x,l[0],l[1]);tz=ovZ;}
function resetView(){var o=objs[idx];o.tilt.quaternion.copy(o.base);setFocusLimits(true);}
var qy=new T.Quaternion(),qx=new T.Quaternion(),AY=new T.Vector3(0,1,0),AX=new T.Vector3(1,0,0);
function rotate(dx,dy){var o=objs[idx];qy.setFromAxisAngle(AY,dx*.008);qx.setFromAxisAngle(AX,dy*.008);o.tilt.quaternion.premultiply(qy).premultiply(qx);}

var ptr=new Map(),moved=0,downT=0,pinchD=0,ray=new T.Raycaster(),ndc=new T.Vector2();
function pdist(){var a=Array.from(ptr.values());return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
cv.addEventListener('pointerdown',function(e){try{cv.setPointerCapture(e.pointerId);}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===1){moved=0;downT=performance.now();}if(ptr.size===2){pinchD=pdist();moved=99;}});
cv.addEventListener('pointermove',function(e){var p=ptr.get(e.pointerId);if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptr.size===2){var d=pdist();if(pinchD&&mode==='focus')tz=clamp(tz*pinchD/d,zMin,zMax);pinchD=d;return;}
 moved+=Math.abs(dx)+Math.abs(dy);
 if(mode==='over'){var upp=visW/window.innerWidth,l=panLimits();panX=clamp(panX-dx*upp,l[0],l[1]);}else rotate(dx,dy);});
function pup(e){if(!ptr.has(e.pointerId))return;var was=ptr.size;ptr.delete(e.pointerId);pinchD=0;
 if(was===1&&moved<10&&performance.now()-downT<500&&mode==='over')pick(e.clientX,e.clientY);}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',function(e){ptr.delete(e.pointerId);pinchD=0;});
cv.addEventListener('wheel',function(e){e.preventDefault();if(mode==='focus')tz=clamp(tz*Math.exp(e.deltaY*.001),zMin,zMax);else{var l=panLimits();panX=clamp(panX+e.deltaY*.02,l[0],l[1]);}},{passive:false});
function pick(x,y){ndc.set(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1);ray.setFromCamera(ndc,cam);var h=ray.intersectObjects(proxies,false);if(h.length)focus(h[0].object.userData.i);}

$('back').onclick=home;
$('prev').onclick=function(){focus(idx-1);};$('next').onclick=function(){focus(idx+1);};
$('zin').onclick=function(){tz=clamp(tz*.78,zMin,zMax);};$('zout').onclick=function(){tz=clamp(tz*1.28,zMin,zMax);};
$('reset').onclick=resetView;
$('info').onclick=function(){panelOpen=!panelOpen;$('panel').classList.toggle('hid',!panelOpen);document.body.classList.toggle('closed',!panelOpen);measure();};
window.addEventListener('keydown',function(e){if(mode==='focus'){if(e.key==='Escape')home();else if(e.key==='ArrowLeft')focus(idx-1);else if(e.key==='ArrowRight')focus(idx+1);}});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

/* ===== LOOP RENDER ===== */
var raf=0,last=0,v3=new T.Vector3();
function frame(t){raf=requestAnimationFrame(frame);var dt=Math.min((t-last)/1000||.016,.05);last=t;
 var k=1-Math.exp(-dt*6),i,o;
 if(mode==='over'){tx=panX;ty=0;}
 else{o=objs[idx];var vh=2*tz*TAN,vw=vh*cam.aspect;tx=o.d.x+(pw?vw*(pw/2)/window.innerWidth:0);ty=ph?-vh*(ph/2)/window.innerHeight:0;}
 var zt=mode==='over'?ovZ:tz;
 cam.position.x+=(tx-cam.position.x)*k;cam.position.y+=(ty-cam.position.y)*k;cam.position.z+=(zt-cam.position.z)*k;
 for(i=0;i<objs.length;i++){o=objs[i];o.mesh.rotation.y+=o.d.spin*dt;if(o.clouds)o.clouds.rotation.y+=.03*dt;
  if(mode==='over'){v3.set(o.d.x,-(o.d.r*(o.d.ring?1.2:1))-.3,0).project(cam);
   var sx=(v3.x*.5+.5)*window.innerWidth,sy=(-v3.y*.5+.5)*window.innerHeight,w=o.lab.offsetWidth;
   o.lab.style.transform='translate('+(sx-w/2).toFixed(1)+'px,'+sy.toFixed(1)+'px)';}}
 renderer.render(scene,cam);}
function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}}
function stop(){cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',function(){if(document.hidden)stop();else if(objs.length)start();});
cv.addEventListener('webglcontextlost',function(e){e.preventDefault();stop();note('Konteks grafis hilang. Muat ulang halaman jika layar kosong.');});
cv.addEventListener('webglcontextrestored',function(){start();});
window.addEventListener('pagehide',function(){stop();scene.traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material){if(n.material.map)n.material.map.dispose();n.material.dispose();}});renderer.dispose();});

cam.position.set(0,0,20);resize();setTimeout(step,30);
})();
</script>
</body>
</html>
